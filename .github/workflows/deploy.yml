name: Dual-Branch CI/CD Deployment (Zero Code Changes)

on:
  push:
    branches:
      - dev
      - main

jobs:
  test:
    name: Run Automated Test Suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Backend Tests
        env:
          PYTHONPATH: src/backend:.
        run: |
          pytest src/tests/ -v

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Run Frontend Tests
        run: |
          cd src/frontend
          flutter pub get
          flutter test

  deploy:
    name: Build & Deploy to GCP Cloud Run & Firebase Hosting
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    env:
      GCP_PROJECT: ${{ github.ref == 'refs/heads/main' && 'freeocr-prod' || 'freeocr-staging-app' }}
      DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Compile Flutter Web Release Bundle
        run: |
          cd src/frontend
          flutter pub get
          flutter build web --release --no-wasm-dry-run

      - name: Build Pre-rendered Static SEO Pages
        run: |
          python scripts/build_seo_pages.py

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build & Push Backend Container Image via Cloud Build
        run: |
          gcloud builds submit src/backend \
            --tag gcr.io/${{ env.GCP_PROJECT }}/freeocr-backend:latest \
            --project ${{ env.GCP_PROJECT }}

      - name: Deploy Backend to GCP Cloud Run (Scale-to-Zero)
        run: |
          gcloud run deploy freeocr-api \
            --image gcr.io/${{ env.GCP_PROJECT }}/freeocr-backend:latest \
            --region us-central1 \
            --platform managed \
            --min-instances 0 \
            --max-instances 5 \
            --memory 2Gi \
            --cpu 2 \
            --timeout 300 \
            --allow-unauthenticated \
            --set-env-vars "ENVIRONMENT=${{ env.DEPLOY_ENV }}" \
            --project ${{ env.GCP_PROJECT }}

      - name: Deploy Frontend to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.GCP_SA_KEY }}
          channelId: live
          projectId: ${{ env.GCP_PROJECT }}
