steps:
  # Build Baidu Unlimited OCR GPU container with pre-baked model weights
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.gpu'
      - '-t'
      - 'us-central1-docker.pkg.dev/freeocr-staging-app/freeocr/gpu-worker:latest'
      - '.'
    timeout: '1500s'

images:
  - 'us-central1-docker.pkg.dev/freeocr-staging-app/freeocr/gpu-worker:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '1800s'
